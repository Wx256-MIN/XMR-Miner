version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: xmr-miner_xmr-miner_1
      APP_PORT: 80
      PROXY_AUTH_WHITELIST: "/2/*"

  xmr-miner:
    build:
      context: .
      args:
        XMRIG_VERSION: "6.26.0"
    restart: on-failure
    init: true
    environment:
      XMR_POOL: "${XMR_POOL}"
      XMR_WALLET: "${XMR_WALLET}"
      XMR_WORKER: "${XMR_WORKER:-umbrel}"
      XMR_THREADS: "${XMR_THREADS:-0}"
      XMR_DONATE_LEVEL: "${XMR_DONATE_LEVEL:-1}"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    expose:
      - "80"
    ports:
      - "8080:8080"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/2/summary"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
