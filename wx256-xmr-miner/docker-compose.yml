version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: wx256-xmr-miner_xmr-miner_1
      APP_PORT: 80
      PROXY_AUTH_WHITELIST: "/api/*"

  xmr-miner:
    image: ghcr.io/wx256-min/xmr-miner:0.4.9
    restart: on-failure
    init: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    expose:
      - "80"
    stop_grace_period: 30s
