version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: wx256-xmr-miner_xmr-miner_1
      APP_PORT: 80
      PROXY_AUTH_WHITELIST: "/2/*"

  xmr-miner:
    build:
      context: .
      args:
        XMRIG_VERSION: "6.26.0"
    restart: on-failure
    init: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    expose:
      - "80"
    stop_grace_period: 30s
