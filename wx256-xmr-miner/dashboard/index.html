<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>XMR Miner</title><style>body{margin:0;background:#0b0d12;color:#f4f5f7;font:15px system-ui,-apple-system,sans-serif}main{max-width:1000px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.badge{padding:6px 10px;border-radius:20px;background:#183b28;color:#6ee7a0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#151922;border:1px solid #262b36;border-radius:14px;padding:18px}.label{color:#9aa2b1;font-size:13px}.value{font-size:25px;font-weight:700;margin-top:7px}.wide{margin-top:14px}.muted{color:#9aa2b1}code{color:#d8dee9}</style></head><body><main><div class='top'><div><h1 style='margin:0'>XMR Miner</h1><div class='muted'>Monero CPU mining • XMRig</div></div><div id='status' class='badge'>Connecting…</div></div><div class='grid'><div class='card'><div class='label'>Current Hashrate</div><div id='hash' class='value'>—</div></div><div class='card'><div class='label'>Accepted Shares</div><div id='accepted' class='value'>—</div></div><div class='card'><div class='label'>Rejected Shares</div><div id='rejected' class='value'>—</div></div><div class='card'><div class='label'>Uptime</div><div id='uptime' class='value'>—</div></div></div><div class='card wide'><div class='label'>Pool / Connection</div><p id='pool'>Loading…</p><p class='muted'>Worker: <span id='worker'>—</span></p></div><div class='card wide'><div class='label'>XMRig API</div><p class='muted'>Internal API is available to the dashboard. It is not intentionally exposed as the app's public interface.</p></div><script>const $=id=>document.getElementById(id);function fmtHash(n){if(!Number.isFinite(n))return '—';const u=['H/s','kH/s','MH/s','GH/s'];let i=0;while(n>=1000&&i<u.length-1){n/=1000;i++}return n.toFixed(n>=100?0:n>=10?1:2)+' '+u[i]}function fmtTime(s){if(!Number.isFinite(s))return '—';s=Math.floor(s);let d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);return (d?d+'d ':'')+(h?h+'h ':'')+(m?m+'m ':'')+s+'s'}async function refresh(){try{const r=await fetch('/2/summary');if(!r.ok)throw Error();const x=await r.json();$('status').textContent='Mining';$('status').style.background='#183b28';$('hash').textContent=fmtHash(x.hashrate?.total?.[0]??x.hashrate?.total);$('accepted').textContent=x.results?.shares_good??'—';$('rejected').textContent=x.results?.shares_total!=null&&x.results?.shares_good!=null?x.results.shares_total-x.results.shares_good:'—';$('uptime').textContent=fmtTime(x.uptime);$('worker').textContent=x.worker_id||'configured worker';$('pool').textContent=x.connection?.pool||'Connected to configured pool'}catch(e){$('status').textContent='Miner offline';$('status').style.background='#4a1d24'}}setInterval(refresh,5000);refresh();</script></main></body></html>
