<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>XMR Miner</title>
<style>body{margin:0;background:#0b0d12;color:#f4f5f7;font:15px system-ui,-apple-system,sans-serif}main{max-width:1050px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:14px}.badge{padding:6px 10px;border-radius:20px;background:#343b48;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#151922;border:1px solid #262b36;border-radius:14px;padding:18px}.label{color:#9aa2b1;font-size:13px}.value{font-size:25px;font-weight:700;margin-top:7px}.wide{margin-top:14px}.muted{color:#9aa2b1}input{width:100%;box-sizing:border-box;padding:11px 12px;margin:6px 0 12px;border-radius:9px;border:1px solid #303745;background:#0f131b;color:#fff}button{padding:10px 15px;border:0;border-radius:9px;background:#f97316;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#343b48}.hidden{display:none}.error{color:#ff8c9a}.ok{color:#6ee7a0}</style></head>
<body><main><div class="top"><div class="brand"><img class="logo" src="/favicon.svg"><div><h1 style="margin:0">XMR Miner</h1><div class="muted">Monero CPU mining • XMRig</div></div></div><div id="status" class="badge">Checking…</div></div>
<section id="setup" class="card hidden"><h2 style="margin-top:0">Miner setup</h2><p class="muted">Enter your Monero pool and wallet. Configuration is saved locally on your Umbrel.</p><label>Pool URL</label><input id="pool" placeholder="pool.example.com:3333"><label>Monero wallet address</label><input id="wallet" placeholder="4... or 8..."><label>Worker name</label><input id="worker" value="umbrel"><label>CPU threads <span class="muted">(0 = automatic)</span></label><input id="threads" type="number" min="0" value="0"><label>Donation level %</label><input id="donate" type="number" min="0" value="1"><button onclick="save()">Save & Start Mining</button><p id="message"></p></section>
<section id="dashboard" class="hidden"><div class="grid"><div class="card"><div class="label">Current Hashrate</div><div id="hash" class="value">—</div></div><div class="card"><div class="label">Accepted Shares</div><div id="accepted" class="value">—</div></div><div class="card"><div class="label">Rejected Shares</div><div id="rejected" class="value">—</div></div><div class="card"><div class="label">Uptime</div><div id="uptime" class="value">—</div></div></div><div class="card wide"><div class="label">Pool / Connection</div><p id="poolName">Loading…</p><p class="muted">Worker: <span id="workerName">—</span></p></div><div class="card wide"><button class="secondary" onclick="stop()">Stop Miner</button> <button onclick="showSetup()">Change Configuration</button></div></section></main>
<script>
const $=id=>document.getElementById(id);function fmtHash(n){if(!Number.isFinite(n))return"—";const u=["H/s","kH/s","MH/s","GH/s"];let i=0;while(n>=1000&&i<u.length-1){n/=1000;i++}return n.toFixed(n>=100?0:n>=10?1:2)+" "+u[i]}function fmtTime(s){if(!Number.isFinite(s))return"—";s=Math.floor(s);let d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);return(d?d+"d ":"")+(h?h+"h ":"")+(m?m+"m ":"")+s+"s"}async function api(url,opt){const r=await fetch(url,opt);return await r.json()}async function boot(){try{const x=await api("/api/config");if(!x.configured){showSetup();return}$("dashboard").classList.remove("hidden");refresh()}catch(e){$("status").textContent="Dashboard error"}}function showSetup(){$("setup").classList.remove("hidden");$("dashboard").classList.add("hidden");api("/api/config").then(x=>{const c=x.config||{};$("pool").value=c.pool||"";$("worker").value=c.worker||"umbrel";$("threads").value=c.threads??0;$("donate").value=c.donate_level??1})}async function save(){const msg=$("message");msg.textContent="Saving…";try{const x=await api("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pool:$("pool").value,wallet:$("wallet").value,worker:$("worker").value,threads:$("threads").value,donate_level:$("donate").value})});if(!x.ok)throw Error(x.message);msg.className="ok";msg.textContent=x.message;$("setup").classList.add("hidden");$("dashboard").classList.remove("hidden");refresh()}catch(e){msg.className="error";msg.textContent=e.message}}async function stop(){await api("/api/stop",{method:"POST"});$("status").textContent="Stopped";$("status").style.background="#4a1d24"}async function refresh(){try{const r=await fetch("/2/summary");if(!r.ok)throw Error();const x=await r.json();$("status").textContent="Mining";$("status").style.background="#183b28";$("hash").textContent=fmtHash(x.hashrate?.total?.[0]??x.hashrate?.total);$("accepted").textContent=x.results?.shares_good??"—";$("rejected").textContent=x.results?.shares_total!=null&&x.results?.shares_good!=null?x.results.shares_total-x.results.shares_good:"—";$("uptime").textContent=fmtTime(x.uptime);$("workerName").textContent=x.worker_id||"configured worker";$("poolName").textContent=x.connection?.pool||"Connected to configured pool"}catch(e){$("status").textContent="Miner offline";$("status").style.background="#4a1d24"}}setInterval(refresh,5000);boot();
</script></body></html>
